services:
  live-sports:
    build:
      context: .
      dockerfile: live-sports.Dockerfile
      args:
        PLUGIN_REF: ${LIVE_SPORTS_REF:-main}
    image: ghcr.io/rajhodedara/live-sport-plugin:latest
    pull_policy: never
    container_name: live-sports
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 200
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 200
    environment:
      - PORT=7000
      - NODE_ENV=production
      - ADDON_URL=https://${LIVE_SPORTS_HOST:-live-sports.fewa.app}
    networks:
      - shared
    labels:
      - traefik.enable=true
      - traefik.http.routers.live-sports.rule=Host(`${LIVE_SPORTS_HOST:-live-sports.fewa.app}`)
      - traefik.http.routers.live-sports.entrypoints=websecure
      - traefik.http.routers.live-sports.tls=true
      - traefik.http.routers.live-sports.tls.certresolver=cloudflare
      - traefik.http.services.live-sports.loadbalancer.server.port=7000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  arvio:
    build:
      context: .
      dockerfile: arvio.Dockerfile
      args:
        ARVIO_REF: ${ARVIO_REF:-main}
        TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
        SIMKL_CLIENT_ID: ${SIMKL_CLIENT_ID:-}
        NEXT_PUBLIC_TELEGRAM_API_ID: ${NEXT_PUBLIC_TELEGRAM_API_ID:-}
        NEXT_PUBLIC_TELEGRAM_API_HASH: ${NEXT_PUBLIC_TELEGRAM_API_HASH:-}
        NEXT_PUBLIC_ARVIO_RESOLVER_URL: ${NEXT_PUBLIC_ARVIO_RESOLVER_URL:-}
    image: arvio:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_SELF_HOSTED=true
      - NEXT_PUBLIC_PAYWALL_ENABLED=false
      - NEXT_TELEMETRY_DISABLED=1
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-}
      - SIMKL_CLIENT_SECRET=${SIMKL_CLIENT_SECRET:-}
      - ALLOW_PRIVATE_PROXY=${ALLOW_PRIVATE_PROXY:-false}
    networks:
      - shared
    labels:
      - traefik.enable=true
      - traefik.http.routers.arvio.rule=Host(`${ARVIO_HOST:-arvio.fewa.app}`)
      - traefik.http.routers.arvio.entrypoints=websecure
      - traefik.http.routers.arvio.tls=true
      - traefik.http.routers.arvio.tls.certresolver=cloudflare
      - traefik.http.services.arvio.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/version.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  shared:
    name: ${SHARED_DOCKER_NETWORK:-internal-network}
    external: true
