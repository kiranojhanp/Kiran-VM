services:
  aiometadata:
    image: ghcr.io/cedya77/aiometadata:${AIOMETADATA_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST_NAME=https://${AIOMETADATA_HOST:-aiometadata.fewa.app}
      - PORT=3232
      - DATABASE_URI=sqlite://addon/data/db.sqlite
      - REDIS_URL=${REDIS_HOST_SHARED}
      - POSTER_PROXY_PREFIX_URL=https://poster-cache.fewa.app
      - POSTER_WARMUP_URL=http://poster-cache:8888
      - POSTER_WARMUP_DELAY_MS=50
    volumes:
      - aiometadata_data:/app/addon/data
    networks:
      - shared
      - infra
    labels:
      - traefik.enable=true
      - traefik.http.routers.aiometadata.rule=Host(`${AIOMETADATA_HOST:-aiometadata.fewa.app}`)
      - traefik.http.routers.aiometadata.entrypoints=websecure
      - traefik.http.routers.aiometadata.tls=true
      - traefik.http.routers.aiometadata.tls.certresolver=cloudflare
      - traefik.http.services.aiometadata.loadbalancer.server.port=3232
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3232/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  live-sports:
    build:
      context: .
      dockerfile: live-sports.Dockerfile
      args:
        PLUGIN_REF: ${LIVE_SPORTS_REF:-main}
    image: ghcr.io/rajhodedara/live-sport-plugin:latest
    pull_policy: never
    container_name: live-sports
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 200
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 200
    environment:
      - PORT=7000
      - NODE_ENV=production
      - ADDON_URL=https://${LIVE_SPORTS_HOST:-live-sports.fewa.app}
    networks:
      - shared
    labels:
      - traefik.enable=true
      - traefik.http.routers.live-sports.rule=Host(`${LIVE_SPORTS_HOST:-live-sports.fewa.app}`)
      - traefik.http.routers.live-sports.entrypoints=websecure
      - traefik.http.routers.live-sports.tls=true
      - traefik.http.routers.live-sports.tls.certresolver=cloudflare
      - traefik.http.services.live-sports.loadbalancer.server.port=7000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  arvio:
    build:
      context: .
      dockerfile: arvio.Dockerfile
      args:
        ARVIO_REF: ${ARVIO_REF:-main}
        TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
        SIMKL_CLIENT_ID: ${SIMKL_CLIENT_ID:-}
        NEXT_PUBLIC_TELEGRAM_API_ID: ${NEXT_PUBLIC_TELEGRAM_API_ID:-}
        NEXT_PUBLIC_TELEGRAM_API_HASH: ${NEXT_PUBLIC_TELEGRAM_API_HASH:-}
        NEXT_PUBLIC_ARVIO_RESOLVER_URL: ${NEXT_PUBLIC_ARVIO_RESOLVER_URL:-}
    image: arvio:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_SELF_HOSTED=true
      - NEXT_PUBLIC_PAYWALL_ENABLED=false
      - NEXT_TELEMETRY_DISABLED=1
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-}
      - SIMKL_CLIENT_SECRET=${SIMKL_CLIENT_SECRET:-}
      - ALLOW_PRIVATE_PROXY=${ALLOW_PRIVATE_PROXY:-false}
    networks:
      - shared
    labels:
      - traefik.enable=true
      - traefik.http.routers.arvio.rule=Host(`${ARVIO_HOST:-arvio.fewa.app}`)
      - traefik.http.routers.arvio.entrypoints=websecure
      - traefik.http.routers.arvio.tls=true
      - traefik.http.routers.arvio.tls.certresolver=cloudflare
      - traefik.http.services.arvio.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/version.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  poster-cache:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./poster-cache-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./poster-cache-stats.sh:/stats.sh:ro
      - poster_cache:/var/cache/nginx
    entrypoint: ["/bin/sh", "-c", "/stats.sh & exec nginx -g 'daemon off;'"]
    expose:
      - "8888"
    networks:
      - shared
    labels:
      - traefik.enable=true
      - traefik.http.routers.poster-cache.rule=Host(`poster-cache.fewa.app`)
      - traefik.http.routers.poster-cache.entrypoints=websecure
      - traefik.http.routers.poster-cache.tls=true
      - traefik.http.routers.poster-cache.tls.certresolver=cloudflare
      - traefik.http.services.poster-cache.loadbalancer.server.port=8888
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  shared:
    name: ${SHARED_DOCKER_NETWORK:-internal-network}
    external: true
  infra:
    name: ${SHARED_INFRA_NETWORK:-infra_net}
    external: true

volumes:
  aiometadata_data:
    name: aiometadata_data
  poster_cache:
    name: poster_cache
