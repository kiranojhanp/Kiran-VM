services:
  papra:
    image: ghcr.io/papra-hq/papra:latest
    container_name: papra
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 100
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      APP_BASE_URL: https://${PAPRA_HOST}
      AUTH_SECRET: ${PAPRA_AUTH_SECRET}
      TZ: ${TZ:-UTC}
      INTAKE_EMAILS_IS_ENABLED: ${INTAKE_EMAILS_IS_ENABLED:-false}
      INTAKE_EMAILS_DRIVER: ${INTAKE_EMAILS_DRIVER:-owlrelay}
      OWLRELAY_API_KEY: ${OWLRELAY_API_KEY}
      INTAKE_EMAILS_WEBHOOK_SECRET: ${INTAKE_EMAILS_WEBHOOK_SECRET}
      OWLRELAY_WEBHOOK_URL: ${OWLRELAY_WEBHOOK_URL}
    volumes:
      - papra_data:/app/app-data
    networks:
      - shared
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${SHARED_DOCKER_NETWORK}
      traefik.http.routers.papra.rule: Host(`${PAPRA_HOST}`)
      traefik.http.routers.papra.entrypoints: websecure
      traefik.http.routers.papra.tls: "true"
      traefik.http.routers.papra.tls.certresolver: letsencrypt
      traefik.http.services.papra.loadbalancer.server.port: "1221"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1221/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  shared:
    name: ${SHARED_DOCKER_NETWORK}
    external: true

volumes:
  papra_data:
