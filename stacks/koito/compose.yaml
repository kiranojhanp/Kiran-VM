services:
  koito:
    image: gabehf/koito:v0.3.2
    container_name: koito
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 200
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 100
    environment:
      TZ: ${TZ:-UTC}
      KOITO_FORCE_TZ: ${TZ:-UTC}
      KOITO_LOGIN_GATE: ${KOITO_LOGIN_GATE:-true}
      KOITO_LOG_LEVEL: ${KOITO_LOG_LEVEL:-info}
      KOITO_DEFAULT_USERNAME: ${KOITO_DEFAULT_USERNAME:-admin}
      KOITO_DEFAULT_PASSWORD: ${KOITO_DEFAULT_PASSWORD:?KOITO_DEFAULT_PASSWORD must be set}
      KOITO_ENABLE_LBZ_RELAY: ${KOITO_ENABLE_LBZ_RELAY:-false}
      KOITO_LBZ_RELAY_URL: ${KOITO_LBZ_RELAY_URL:-}
      KOITO_LBZ_RELAY_TOKEN: ${KOITO_LBZ_RELAY_TOKEN:-}
      KOITO_SUBSONIC_URL: ${KOITO_SUBSONIC_URL:-}
      KOITO_SUBSONIC_PARAMS: ${KOITO_SUBSONIC_PARAMS:-}
      KOITO_LASTFM_API_KEY: ${KOITO_LASTFM_API_KEY:-}
    volumes:
      - koito_data:/etc/koito
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/4110'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - shared
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${SHARED_DOCKER_NETWORK:-internal-network}
      traefik.http.routers.koito.rule: Host(`${KOITO_HOST:-koito.fewa.app}`)
      traefik.http.routers.koito.entrypoints: websecure
      traefik.http.routers.koito.tls: "true"
      traefik.http.routers.koito.tls.certresolver: letsencrypt
      traefik.http.services.koito.loadbalancer.server.port: "4110"

networks:
  shared:
    name: ${SHARED_DOCKER_NETWORK:-internal-network}
    external: true

volumes:
  koito_data:
